kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
dockerfile = "Dockerfile"

[env]
RUST_LOG = "info"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[http_service.concurrency]
type = "connections"
soft_limit = 800
hard_limit = 1000

[[http_service.checks]]
interval = "15s"
timeout = "5s"
grace_period = "10s"
method = "GET"
path = "/health"
